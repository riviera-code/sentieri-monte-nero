<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Sentieri Monte Nero</title>
<meta name="description" content="Mappa dei sentieri e-bike/MTB di Monte Nero e dintorni, con posizione GPS e uso offline.">
<meta name="theme-color" content="#1f3a2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monte Nero">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<div id="status" class="status" hidden></div>

<div class="fab-col">
  <button id="btn-locate" class="fab" aria-label="Mostra la mia posizione" title="La mia posizione">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
  <button id="btn-home" class="fab" aria-label="Inquadra Monte Nero" title="Inquadra la zona">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 20l6-10 4 6 3-4 5 8z" fill="currentColor"/></svg>
  </button>
  <button id="btn-offline" class="fab" aria-label="Scarica la mappa per l'uso offline" title="Mappa offline">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3v11m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</div>

<section id="sheet" class="sheet" aria-label="Elenco sentieri">
  <button id="sheet-handle" class="sheet-handle" aria-expanded="false">
    <span class="grip"></span>
    <span id="sheet-title">Sentieri</span>
  </button>
  <div id="list" class="list"></div>
  <p class="foot">Tracce: rilievi personali e komoot. La posizione resta sul tuo telefono, non viene inviata a nessuno.</p>
</section>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
